name: Python CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Run unit tests
        run: python -m unittest discover -v
